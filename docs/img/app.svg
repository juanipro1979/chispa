<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d">
  <title id="t">La app de Chispa en vivo</title>
  <desc id="d">Ilustración de la ventana de Chispa transmitiendo a Twitch y Kick, con los botones Clip, Grabar y En vivo, las escenas, y un comando de voz reconocido. A la derecha, el chat unificado de Twitch y Kick con una alerta de suscripción.</desc>
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0" stop-color="#2a1a10"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </radialGradient>
  </defs>
  <rect width="960" height="640" rx="24" fill="url(#bg)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- ================= Ventana principal ================= -->
    <g transform="translate(60 40)" filter="url(#sh)">
      <rect width="400" height="566" rx="14" fill="#111113" stroke="#2c2c33"/>
      <!-- barra de título -->
      <path d="M0 14a14 14 0 0 1 14-14h372a14 14 0 0 1 14 14v18H0z" fill="#1a1a1e"/>
      <text x="14" y="21" font-size="11" fill="#8b8b96">Chispa</text>
      <text x="384" y="21" font-size="11" fill="#8b8b96" text-anchor="end">—  ▢  ✕</text>

      <!-- header -->
      <path transform="translate(16 46) scale(.9)" d="M13 2 4 14h7l-1 8 9-12h-7z" fill="#ff7a1a"/>
      <text x="40" y="64" font-size="17" font-weight="700" fill="#ececf0">Chispa</text>
      <rect x="196" y="48" width="188" height="24" rx="12" fill="#1a1a1e" stroke="#2c2c33"/>
      <text x="290" y="64" font-size="10" fill="#8b8b96" text-anchor="middle">Potato · 1280x720 · 30 fps · GPU</text>

      <!-- tabs -->
      <text x="70" y="102" font-size="13" fill="#ececf0" text-anchor="middle">Control</text>
      <rect x="20" y="110" width="100" height="2" fill="#ff7a1a"/>
      <text x="200" y="102" font-size="13" fill="#8b8b96" text-anchor="middle">Chat</text>
      <rect x="220" y="91" width="20" height="14" rx="7" fill="#ff7a1a"/>
      <text x="230" y="102" font-size="9" font-weight="700" fill="#1a0d00" text-anchor="middle">12</text>
      <text x="330" y="102" font-size="13" fill="#8b8b96" text-anchor="middle">Ajustes</text>
      <rect x="16" y="112" width="368" height="1" fill="#2c2c33"/>

      <!-- Clip -->
      <rect x="16" y="126" width="178" height="96" rx="14" fill="#1a1a1e" stroke="#2c2c33"/>
      <text x="30" y="154" font-size="18" fill="#ff7a1a">✂</text>
      <text x="30" y="184" font-size="15" font-weight="650" fill="#ececf0">Clip</text>
      <text x="30" y="203" font-size="11" fill="#8b8b96">últimos 30 s</text>
      <rect x="128" y="134" width="56" height="18" rx="5" fill="#111113" stroke="#2c2c33"/>
      <text x="156" y="147" font-size="10" fill="#8b8b96" text-anchor="middle" font-family="Consolas, monospace">Alt+F10</text>

      <!-- Grabar (activo) -->
      <rect x="206" y="126" width="178" height="96" rx="14" fill="#ff7a1a22" stroke="#ff7a1a"/>
      <rect x="220" y="142" width="14" height="14" rx="3" fill="#ff7a1a"/>
      <text x="220" y="184" font-size="15" font-weight="650" fill="#ececf0">Parar</text>
      <text x="220" y="203" font-size="11" fill="#8b8b96">12:48</text>
      <rect x="318" y="134" width="56" height="18" rx="5" fill="#111113" stroke="#2c2c33"/>
      <text x="346" y="147" font-size="10" fill="#8b8b96" text-anchor="middle" font-family="Consolas, monospace">Alt+F9</text>

      <!-- En vivo (activo) -->
      <rect x="16" y="232" width="368" height="78" rx="14" fill="#ff3b4a1c" stroke="#ff3b4a"/>
      <circle cx="36" cy="254" r="7" fill="#ff3b4a"/>
      <text x="30" y="282" font-size="15" font-weight="650" fill="#ececf0">Cortar stream</text>
      <text x="30" y="300" font-size="11" fill="#8b8b96">Twitch + Kick · 1:02:17</text>
      <rect x="318" y="240" width="56" height="18" rx="5" fill="#111113" stroke="#2c2c33"/>
      <text x="346" y="253" font-size="10" fill="#8b8b96" text-anchor="middle" font-family="Consolas, monospace">Alt+F8</text>

      <!-- Escenas -->
      <rect x="16" y="322" width="368" height="34" rx="10" fill="#0b0b0d"/>
      <rect x="19" y="325" width="120" height="28" rx="8" fill="#222228"/>
      <text x="79" y="344" font-size="12" fill="#ececf0" text-anchor="middle">Juego</text>
      <text x="200" y="344" font-size="12" fill="#8b8b96" text-anchor="middle">Ya vuelvo</text>
      <text x="322" y="344" font-size="12" fill="#8b8b96" text-anchor="middle">Charla</text>

      <!-- Filas -->
      <rect x="16" y="366" width="368" height="126" rx="14" fill="#1a1a1e" stroke="#2c2c33"/>
      <g font-size="13" fill="#ececf0">
        <text x="30" y="392">Clip vertical (TikTok/Shorts)</text>
        <text x="30" y="434">Micrófono</text>
        <text x="30" y="476">Voz «Chispa, …»</text>
      </g>
      <g fill="#2c2c33"><rect x="16" y="408" width="368" height="1"/><rect x="16" y="450" width="368" height="1"/></g>
      <g font-size="11">
        <rect x="320" y="422" width="52" height="18" rx="9" fill="#111113"/><text x="346" y="435" fill="#3ddc84" text-anchor="middle">activo</text>
        <rect x="298" y="464" width="74" height="18" rx="9" fill="#111113"/><text x="335" y="477" fill="#3ddc84" text-anchor="middle">escuchando</text>
      </g>

      <!-- toast de voz -->
      <rect x="16" y="502" width="368" height="52" rx="12" fill="#26262d" stroke="#3ddc8466"/>
      <text x="30" y="533" font-size="13" fill="#ececf0">🎙 «Chispa, clipeá eso» <tspan fill="#8b8b96">→ Clip guardado (30 s)</tspan></text>
    </g>

    <!-- ================= Chat unificado ================= -->
    <g transform="translate(500 80)" filter="url(#sh)">
      <rect width="400" height="480" rx="14" fill="#111113" stroke="#2c2c33"/>
      <text x="20" y="34" font-size="15" font-weight="700" fill="#ececf0">Chat unificado</text>
      <text x="380" y="34" font-size="12" fill="#8b8b96" text-anchor="end">Twitch + Kick</text>
      <rect x="16" y="48" width="368" height="416" rx="12" fill="#1a1a1e" stroke="#2c2c33"/>
      <g font-size="13">
        <rect x="28" y="66" width="15" height="15" rx="4" fill="#9146ff"/><text x="35.5" y="77.5" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">T</text>
        <text x="52" y="78"><tspan font-weight="650" fill="#ff7f50">lucho_gg</tspan><tspan fill="#ececf0"> qué jugadón jajaja</tspan></text>

        <rect x="28" y="96" width="15" height="15" rx="4" fill="#53fc18"/><text x="35.5" y="107.5" font-size="9" font-weight="800" fill="#000" text-anchor="middle">K</text>
        <text x="52" y="108"><tspan font-weight="650" fill="#7dd3fc">meli.uwu</tspan><tspan fill="#ececf0"> clipealo!!</tspan></text>

        <rect x="28" y="126" width="15" height="15" rx="4" fill="#9146ff"/><text x="35.5" y="137.5" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">T</text>
        <text x="52" y="138"><tspan font-weight="650" fill="#a3e635">tano_99</tspan><tspan fill="#ececf0"> anda re fluido el stream</tspan></text>

        <!-- alerta -->
        <rect x="26" y="156" width="348" height="54" rx="8" fill="#ff7a1a22"/>
        <rect x="26" y="156" width="3" height="54" fill="#ff7a1a"/>
        <rect x="38" y="167" width="15" height="15" rx="4" fill="#53fc18"/><text x="45.5" y="178.5" font-size="9" font-weight="800" fill="#000" text-anchor="middle">K</text>
        <text x="62" y="179" fill="#ececf0">rocio_k regaló 5 suscripciones</text>
        <text x="62" y="199" fill="#ff9a4d" font-size="12">también aparece en el stream ⚡</text>

        <rect x="28" y="226" width="15" height="15" rx="4" fill="#9146ff"/><text x="35.5" y="237.5" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">T</text>
        <text x="52" y="238"><tspan font-weight="650" fill="#f472b6">nachito</tspan><tspan fill="#ececf0"> en qué pc lo corrés?</tspan></text>

        <rect x="28" y="256" width="15" height="15" rx="4" fill="#53fc18"/><text x="35.5" y="267.5" font-size="9" font-weight="800" fill="#000" text-anchor="middle">K</text>
        <text x="52" y="268"><tspan font-weight="650" fill="#fbbf24">pepe</tspan><tspan fill="#ececf0"> :KEKW: :KEKW:</tspan></text>

        <rect x="26" y="286" width="348" height="54" rx="8" fill="#ff7a1a22"/>
        <rect x="26" y="286" width="3" height="54" fill="#ff7a1a"/>
        <rect x="38" y="297" width="15" height="15" rx="4" fill="#9146ff"/><text x="45.5" y="308.5" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">T</text>
        <text x="62" y="309" fill="#ececf0">ana_plays mandó 500 bits</text>
        <text x="62" y="329" fill="#ff9a4d" font-size="12">«¡vamos que se puede!»</text>

        <rect x="28" y="356" width="15" height="15" rx="4" fill="#9146ff"/><text x="35.5" y="367.5" font-size="9" font-weight="800" fill="#fff" text-anchor="middle">T</text>
        <text x="52" y="368"><tspan font-weight="650" fill="#ff7f50">lucho_gg</tspan><tspan fill="#ececf0"> en una RX 560 y 8 GB 😮</tspan></text>
      </g>
      <text x="200" y="448" font-size="11" fill="#8b8b96" text-anchor="middle">Ilustración · los nombres son de ejemplo</text>
    </g>
  </g>
</svg>
